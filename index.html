<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML com JS</title>
    <link rel="stylesheet" href="./main.css" />

</head>
<body>
    <div class="container">
        <h1>Entrega Modulo 7</h1>
    
        <form id="form-comparacao">
            <input type="number" id="campoA"  required placeholder="Digite o primeiro número(A)" />

            <input type="number" id="campoB" required placeholder="Digite o segudo número(B)" />
            <p class="error-message">
                O segundo número (B) deve ser maior que o primerio (A)
            </p>
            <button id="Submeter" type="submit">Submeter</button>
        </form>
        <p class="success-message"></p>
    </div>
    <script src="./main.js"></script>

</body>
</html>
